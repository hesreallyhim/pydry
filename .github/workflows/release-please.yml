name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Create release PR or GitHub release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - name: Update floating GitHub Action tags
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          RELEASE_MAJOR: ${{ steps.release.outputs.major }}
          RELEASE_MINOR: ${{ steps.release.outputs.minor }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          major_tag="v${RELEASE_MAJOR}"
          minor_tag="v${RELEASE_MAJOR}.${RELEASE_MINOR}"

          git tag --force "${major_tag}" "${RELEASE_SHA}"
          git tag --force "${minor_tag}" "${RELEASE_SHA}"
          git push --force --atomic origin \
            "refs/tags/${major_tag}" \
            "refs/tags/${minor_tag}"
